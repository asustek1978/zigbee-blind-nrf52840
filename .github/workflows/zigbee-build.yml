name: Zigbee nRF52840 Linux build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/window-covering-end-device
      - experiment/v42-0-7-zigbee-sleep
      - experiment/v42-0-8-zigbee-poll-1s
      - experiment/v42-0-9-zigbee-poll-5s
      - experiment/v42-0-10-button-irq
      - experiment/v42-0-12-uart-power-management
      - experiment/v42-0-13-uarte-stop
      - experiment/v42-0-14-uart-gpio-isolation
      - experiment/v42-0-15-uart-driver-isolation
      - experiment/v42-0-16-uart-deferred-init
      - experiment/v42-0-17-uart-init-deinit
      - experiment/v42-0-18-uart-power-recovery
      - experiment/v42-0-19-uart-pm-suspend-resume
      - experiment/v42-0-20-uart-on-demand-bench
      - experiment/v42-0-21-uart-loopback-timeout
      - experiment/v42-0-22-uart-20min-stress
      - experiment/v42-0-23-tuya-framing-pm-bench
      - experiment/v42-0-25-one-shot-status-tx
    paths:
      - '.github/workflows/zigbee-build.yml'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'include/**'
      - 'boards/**'
      - 'app.overlay'
      - 'Kconfig'
      - 'zigbee2mqtt/**'
      - 'prj.conf'
      - 'CMakeLists.txt'
      - 'Kconfig.sysbuild'
      - 'sysbuild.conf'

permissions:
  contents: read

jobs:
  diagnostic-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout blind application
        uses: actions/checkout@v4
        with:
          path: app

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler \
            wget xz-utils file gcc g++ make python3-dev python3-pip python3-venv \
            libmagic1

      - name: Create Python environment
        run: |
          python3 -m venv "$GITHUB_WORKSPACE/.venv"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/.venv/bin/pip" install -U pip west

      - name: Test Tuya frame parser on host
        run: |
          mkdir -p host-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
             -Iapp/include app/src/tuya_frame.c app/tests/test_tuya_frame.c \
             -o host-test/test_tuya_frame
          host-test/test_tuya_frame

      - name: Verify previously captured P3 motor command bytes
        run: |
          mkdir -p host-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
             -Iapp/include app/src/tuya_frame.c app/src/tuya_motor.c \
             app/tests/test_tuya_motor.c -o host-test/test_tuya_motor
          host-test/test_tuya_motor

      - name: Test observed P3 status reports and invalid DP safety
        run: |
          mkdir -p host-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
             -Iapp/include app/src/tuya_frame.c app/src/tuya_motor_state.c \
             app/tests/test_tuya_motor_state.c -o host-test/test_tuya_motor_state
          host-test/test_tuya_motor_state

      - name: Test passive UART capture and offline decoder
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover -s app/tests -p 'test_tuya_capture.py' -v

      - name: Check Zigbee2MQTT external converter syntax
        run: |
          node --check app/zigbee2mqtt/external_converters/p3_nrf52840.mjs

      - name: Test UF2 memory bounds and reset-vector safety checker
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover -s app/tests -p 'test_uf2_layout.py' -v

      - name: Check HW-954 source Flash partition contract
        run: |
          python3 app/tools/check_board_flash_map.py             app/boards/others/nicenano_zigbee/nicenano_zigbee_nrf52840.dts

      - name: Initialize Nordic Zigbee R23 v1.4.0 workspace
        run: |
          mkdir workspace
          cd workspace
          west init -m https://github.com/nrfconnect/ncs-zigbee --mr v1.4.0 .
          west update
          west list -f '{name}: {revision} {abspath}' > ../west-projects.txt

      - name: Install Zephyr and NCS Python requirements
        run: |
          pip install -r workspace/zephyr/scripts/requirements.txt
          pip install -r workspace/nrf/scripts/requirements.txt

      - name: Install Zephyr SDK
        run: |
          SDK_VERSION=1.0.1
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}/zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          tar -xf "zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          mv "zephyr-sdk-${SDK_VERSION}" "$HOME/zephyr-sdk"
          "$HOME/zephyr-sdk/setup.sh" -t arm-zephyr-eabi -h -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk" >> "$GITHUB_ENV"

      - name: Build custom nice nano board (diagnostic)
        id: build
        continue-on-error: true
        working-directory: workspace
        run: |
          set -o pipefail
          west build -b nicenano_zigbee/nrf52840 \
            -d "$GITHUB_WORKSPACE/build-nicenano" \
            --pristine=always --no-sysbuild \
            "$GITHUB_WORKSPACE/app" -- \
            "-DBOARD_ROOT=$GITHUB_WORKSPACE/app" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify v42.0-25 UART driver isolation
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          grep -q 'src/tuya_uart_isolated.c' app/CMakeLists.txt
          if grep -qF '  src/tuya_uart.c' app/CMakeLists.txt; then
            echo '::error::UART worker still compiled'
            exit 1
          fi
          grep -q 'zephyr,deferred-init;' app/app.overlay
          python3 - <<'PY'
          from pathlib import Path
          dts = Path('build-nicenano/zephyr/zephyr.dts').read_text()
          node_start = dts.find('uart0: uart@40002000 {')
          if node_start < 0:
              raise SystemExit('::error::UART0 node missing in generated DTS')
          node_end = dts.find('};', node_start)
          node = dts[node_start:node_end]
          if 'zephyr,deferred-init;' not in node or 'status = "okay";' not in node:
              raise SystemExit('::error::UART0 is not enabled with deferred-init')
          print('UART0 DeviceTree deferred-init: confirmed')
          PY
          cfg=build-nicenano/zephyr/.config
          grep -qx '^CONFIG_PM_DEVICE=y' "$cfg" || { echo '::error::CONFIG_PM_DEVICE is not enabled'; exit 1; }
          grep -q 'device_init(uart)' app/src/main.c
          grep -q 'PM_DEVICE_ACTION_SUSPEND' app/src/main.c
          grep -q 'PM_DEVICE_ACTION_RESUME' app/src/main.c
          grep -q 'P3_UART_INIT_RC 0xF11FU' app/src/main.c
          grep -q 'P3_UART_DEINIT_RC 0xF120U' app/src/main.c
          grep -q 'P3_UART_RESUME_RC 0xF122U' app/src/main.c
          grep -q 'P3_UART_SUSPEND2_RC 0xF123U' app/src/main.c
          grep -q 'P3_UART_RX_RC 0xF124U' app/src/main.c
          grep -q 'P3_UART_RX_BYTE 0xF125U' app/src/main.c
          grep -q 'P3_UART_RX_ATTEMPTS 0xF126U' app/src/main.c
          grep -q 'P3_UART_RX_WAIT_MS 0xF127U' app/src/main.c
          grep -q 'P3_STRESS_CYCLES 0xF128U' app/src/main.c
          grep -q 'P3_STRESS_ELAPSED_S 0xF132U' app/src/main.c
          # v42.0-25 uses an inline 5-second schedule, not interval_ms.
          grep -q 'cycle \* 5000U' app/src/main.c || { echo '::error::RX window interval is not 5000 ms'; exit 1; }
          grep -q 'window_start) < 200U' app/src/main.c || { echo '::error::RX window duration is not 200 ms'; exit 1; }
          grep -q 'tuya_parser_feed(&parser' app/src/main.c
          grep -q 'P3_TUYA_FRAMES_OK 0xF133U' app/src/main.c
          grep -q 'uart_poll_in(uart, &received)' app/src/main.c
          # Permit exactly one hard-coded 7-byte status query on cycle 0.
          grep -q 'if (cycle == 0U)' app/src/main.c
          grep -q '0x55U, 0xAAU, 0x00U, 0x08U, 0x00U, 0x00U, 0x07U' app/src/main.c
          grep -q 'blind_ctx.stress_tx_bytes++' app/src/main.c
          test "$(grep -c 'uart_poll_out(uart,' app/src/main.c)" -eq 1
          if grep -qx '^CONFIG_P3_UART_TX_ENABLE=y' "$cfg"; then echo '::error::Motor command TX must remain disabled'; exit 1; fi
          grep -q 'P3_UART_TEST_PHASE 0xF121U' app/src/main.c
          echo "=== v42.0-25 power configuration diagnostics ==="
          grep -E '^(CONFIG_(ZIGBEE_ROLE_END_DEVICE|PM|TICKLESS_KERNEL|LOG)=|# CONFIG_(ZIGBEE_ROLE_END_DEVICE|PM|TICKLESS_KERNEL|LOG) is not set)' "$cfg" || true
          for opt in ZIGBEE_ROLE_END_DEVICE TICKLESS_KERNEL; do
            if ! grep -qx "CONFIG_${opt}=y" "$cfg"; then
              echo "::error::CONFIG_${opt}=y is missing from generated Zephyr .config"
              exit 1
            fi
          done
          if grep -qx 'CONFIG_LOG=y' "$cfg"; then
            echo "::error::CONFIG_LOG is still enabled in generated Zephyr .config"
            exit 1
          fi
          grep -q 'calibration-button' app/app.overlay
          grep -q 'P3 LOCAL ordinary DP1 STOP queued' app/src/main.c
          grep -q 'P3_BUTTON_PRESS_COUNT 0xF119U' app/src/main.c
          grep -q 'P3_BUTTON_LAST_EVENT 0xF11AU' app/src/main.c
          grep -q 'P3_LOCAL_FINISH_TX_DELAY_MS 0xF11EU' app/src/main.c
          grep -q 'tuya_motor_encode_action(TUYA_MOTOR_STOP' app/src/tuya_uart.c
          grep '^CONFIG_USE_DT_CODE_PARTITION=y' "$cfg"
          for opt in P3_MCU_INIT_ENABLE P3_DIAG_STARTUP_QUERIES P3_ZCL_POSITION_INVERT; do
            if grep -qx "CONFIG_${opt}=y" "$cfg"; then
              echo "::error::Unsafe default: CONFIG_${opt} enabled"
              exit 1
            fi
            # Kconfig hides options whose dependencies are disabled:
            # absent and '# ... is not set' are both SAFE (effectively n).
            # Only an explicitly enabled flag is unsafe for first flash.
            if grep -q "^CONFIG_${opt}=" "$cfg"; then
              grep -qx "CONFIG_${opt}=n" "$cfg" || {
                echo "::error::Unexpected value for CONFIG_${opt}"
                exit 1
              }
            fi
          done
          grep -qx '^CONFIG_P3_ZCL_POSITION_ENABLE=y' "$cfg"
          if grep -qx '^CONFIG_P3_UART_TX_ENABLE=y' "$cfg"; then echo '::error::TX must be off for one-shot TX test'; exit 1; fi
          grep -qx '^CONFIG_P3_ZCL_BATTERY_ENABLE=y' "$cfg"
          if grep -qx '^CONFIG_P3_POSITION_TARGET_ENABLE=y' "$cfg"; then echo '::error::Motor position target must be off'; exit 1; fi
          grep -q 'tuya_uart_submit_position(percent)' app/src/main.c
          grep -qx '^CONFIG_SETTINGS=y' "$cfg"
          grep -qx '^CONFIG_SETTINGS_NVS=y' "$cfg"
          if grep -qx '^CONFIG_P3_HW_CALIBRATION_ENABLE=y' "$cfg"; then echo '::error::Calibration must be off'; exit 1; fi
          grep -q 'tuya_uart_submit_hw_calibration' app/src/main.c
          grep -q 'status = "okay";' app/boards/others/nicenano_zigbee/nicenano_zigbee_nrf52840.dts
          echo "v42.0-25 CONFIG PASS: UART0 driver enabled, UART worker excluded, motor command TX disabled; one status query enabled."

      - name: Convert HEX to UF2 and validate flash ranges
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          test -s build-nicenano/zephyr/zephyr.hex
          python3 workspace/zephyr/scripts/build/uf2conv.py \
            -c -f 0xada52840 \
            -o build-nicenano/zephyr/zephyr.uf2 \
            build-nicenano/zephyr/zephyr.hex
          python3 app/tools/check_uf2_layout.py \
            build-nicenano/zephyr/zephyr.uf2 | tee diagnostic/uf2_report.txt

      - name: Save diagnostic configuration
        if: always()
        run: |
          mkdir -p diagnostic
          cp -f build.log diagnostic/ 2>/dev/null || true
          cp -f west-projects.txt diagnostic/ 2>/dev/null || true
          cp -f build-nicenano/zephyr/.config diagnostic/zephyr.config 2>/dev/null || true
          cp -f build-nicenano/zephyr/zephyr.dts diagnostic/zephyr.dts 2>/dev/null || true
          cp -f build-nicenano/zephyr/zephyr.map diagnostic/zephyr.map 2>/dev/null || true
          if [ -f build-nicenano/zephyr/.config ]; then
            grep -E '^(CONFIG_(SOC_NRF52840|HAS_NRFX|ZIGBEE_ADD_ON|ZIGBEE_ROLE_).*)' build-nicenano/zephyr/.config || true
          fi

      - name: Upload diagnostic files (not flash-ready)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zigbee-build-diagnostics
          path: diagnostic/
          if-no-files-found: warn

      - name: Package P3-NRF52840 v42.0-25 experimental UF2
        if: success() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p release
          cp build-nicenano/zephyr/zephyr.uf2 release/P3-NRF52840-v42-0-25-RX-Only-ON-DEMAND.uf2
          cp diagnostic/uf2_report.txt release/UF2_VALIDATION.txt
          cp build-nicenano/zephyr/.config release/zephyr.config
          git -C app rev-parse HEAD > release/SOURCE_COMMIT.txt
          (
            cd release
            sha256sum P3-NRF52840-v42-0-25-RX-Only-ON-DEMAND.uf2 > SHA256SUMS.txt
            test -s P3-NRF52840-v42-0-25-RX-Only-ON-DEMAND.uf2
          )
          python3 app/tools/check_uf2_layout.py release/P3-NRF52840-v42-0-25-RX-Only-ON-DEMAND.uf2
          cat > release/READ_ME_FIRST.txt <<'EOF'
          P3-NRF52840 v42.0-25 RX-ONLY P3 UART observation
          SPARE HW-954 ONLY. Remove loopback jumper before power-on.
          Connect P3 TXD -> nRF P0.17 RX, common GND ONLY after checking
          voltage levels. NEVER connect nRF TX P0.20 to motor.
          240 receive windows, 200ms each every 5s; 30s startup delay.
          Motor commands are disabled. No bytes transmitted by firmware.
          0xF128 windows; 0xF12C received bytes; 0xF133 valid Tuya frames;
          0xF134 parser rejects; 0xF12E incomplete windows.
          Unsolicited data outside RX windows is intentionally lost.
          Expect 240 completed windows and 0 PM errors; RX bytes may be 0.
          EOF

      - name: Upload P3-NRF52840 v42.0-25 experimental UF2
        if: success() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: P3-NRF52840-v42-0-25-RX-Only-On-Demand-UF2
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Report build status
        if: steps.build.outcome == 'failure'
        run: |
          echo "Diagnostic build failed; inspect zigbee-build-diagnostics artifact."
          exit 1
