name: Zigbee nRF52840 Linux build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/window-covering-end-device
      - experiment/v42-0-7-zigbee-sleep
      - experiment/v42-0-8-zigbee-poll-1s
      - experiment/v42-0-9-zigbee-poll-5s
      - experiment/v42-0-10-button-irq
      - experiment/v42-0-12-uart-power-management
      - experiment/v42-0-13-uarte-stop
      - experiment/v42-0-14-uart-gpio-isolation
      - experiment/v42-0-15-uart-driver-isolation
      - experiment/v42-0-16-uart-deferred-init
      - experiment/v42-0-17-uart-init-deinit
      - experiment/v42-0-18-uart-power-recovery
      - experiment/v42-0-19-uart-pm-suspend-resume
      - experiment/v42-0-20-uart-on-demand-bench
      - experiment/v42-0-21-uart-loopback-timeout
      - experiment/v42-0-22-uart-20min-stress
      - experiment/v42-0-23-tuya-framing-pm-bench
      - experiment/v42-0-25-one-shot-status-tx
      - experiment/v42-0-26-status-response-diagnostics
      - experiment/v42-0-27-rx-edge-wakeup
      - experiment/v42-0-28-continuous-uart-rx
      - experiment/v42-0-29-rx-diagnostics
      - experiment/v42-0-31-gpiote-timer-soft-uart
      - experiment/v42-0-32-continuous-soft-uart
      - experiment/v42-0-34-hybrid-wakeup
      - experiment/v42-0-35-continuous-hybrid-rx
      - experiment/v42-0-36-zigbee-control-hybrid
      - experiment/v42-0-37-zigbee-fast-poll-uart-wake
      - experiment/v42-0-39-rx-error-breakdown
      - experiment/v42-0-40-rx-start-stop-motion-diag
      - experiment/v42-0-44-saadc-idle-rx-diag
      - experiment/v42-0-45-adc-cal-motion-wake
      - experiment/v42-0-46-command-outcome-monitor
      - experiment/v42-0-47-bad-stop-gpio-recovery
      - experiment/v42-0-48-gpiote-ppi-timer-start
      - experiment/v42-0-49-goal-silence-exit
    paths:
      - '.github/workflows/zigbee-build.yml'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'include/**'
      - 'boards/**'
      - 'app.overlay'
      - 'Kconfig'
      - 'zigbee2mqtt/**'
      - 'prj.conf'
      - 'CMakeLists.txt'
      - 'Kconfig.sysbuild'
      - 'sysbuild.conf'

permissions:
  contents: read

jobs:
  diagnostic-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout blind application
        uses: actions/checkout@v5
        with:
          path: app

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler \
            wget xz-utils file gcc g++ make python3-dev python3-pip python3-venv \
            libmagic1

      - name: Create Python environment
        run: |
          python3 -m venv "$GITHUB_WORKSPACE/.venv"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/.venv/bin/pip" install -U pip west

      - name: Test Tuya frame parser on host
        run: |
          mkdir -p host-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
             -Iapp/include app/src/tuya_frame.c app/tests/test_tuya_frame.c \
             -o host-test/test_tuya_frame
          host-test/test_tuya_frame

      - name: Verify previously captured P3 motor command bytes
        run: |
          mkdir -p host-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
             -Iapp/include app/src/tuya_frame.c app/src/tuya_motor.c \
             app/tests/test_tuya_motor.c -o host-test/test_tuya_motor
          host-test/test_tuya_motor

      - name: Test observed P3 status reports and invalid DP safety
        run: |
          mkdir -p host-test
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
             -Iapp/include app/src/tuya_frame.c app/src/tuya_motor_state.c \
             app/tests/test_tuya_motor_state.c -o host-test/test_tuya_motor_state
          host-test/test_tuya_motor_state

      - name: Test passive UART capture and offline decoder
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover -s app/tests -p 'test_tuya_capture.py' -v

      - name: Check Zigbee2MQTT external converter syntax
        run: |
          node --check app/zigbee2mqtt/external_converters/p3_nrf52840.mjs

      - name: Test UF2 memory bounds and reset-vector safety checker
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover -s app/tests -p 'test_uf2_layout.py' -v

      - name: Check HW-954 source Flash partition contract
        run: |
          python3 app/tools/check_board_flash_map.py             app/boards/others/nicenano_zigbee/nicenano_zigbee_nrf52840.dts

      - name: Test low-power hybrid UART diagnostics source contract
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover \
            -s app/tests -p 'test_rx_error_breakdown.py' -v

      - name: Test v42.0-40 start/STOP/motion RX diagnostic contract
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover \
            -s app/tests -p 'test_rx_start_stop_motion.py' -v

      - name: Test v42.0-41 UART hardware/handoff cause diagnostic contract
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover \
            -s app/tests -p 'test_rx_failure_cause_v42_0_41.py' -v
      - name: Test v42.0-43 full UARTE RX motor mode and bounded timeout
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover \
            -s app/tests -p 'test_rx_hardware_motion_v42_0_42.py' -v
      - name: Test v42.0-43 hardware RX watchdog source regression
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover \
            -s app/tests -p 'test_rx_watchdog_v42_0_43.py' -v

      - name: Test v42.0-43 watchdog deadlines and DP1 state transitions on host
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Iapp/include \
            app/tests/test_p3_uart_watchdog.c -o /tmp/test_p3_uart_watchdog
          /tmp/test_p3_uart_watchdog


      - name: Test v42.0-44 SAADC rail and idle UART source contract
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover \
            -s app/tests -p 'test_v42_0_44_power_idle_diag.py' -v

      - name: Test v42.0-45 SAADC calibration and position wake source regression
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover \
            -s app/tests -p 'test_v42_0_45_adc_position_wake.py' -v

      - name: Test v42.0-45 fresh physical-movement DP3 state machine on host
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Iapp/include \
            app/tests/test_p3_position_wake.c -o /tmp/test_p3_position_wake
          /tmp/test_p3_position_wake

      - name: Test v42.0-46 command outcomes static contract
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover \
            -s app/tests -p 'test_v42_0_46_command_outcomes.py' -v

      - name: Test v42.0-46 command outcomes state-machine on host
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Iapp/include \
            app/tests/test_p3_command_monitor.c -o /tmp/test_p3_command_monitor
          /tmp/test_p3_command_monitor

      - name: Test v42.0-47 invalid STOP recovery contract
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover \
            -s app/tests -p 'test_v42_0_47_bad_stop_recovery.py' -v

      - name: Test v42.0-48 PPI edge-start regression contract
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover \
            -s app/tests -p 'test_v42_0_48_ppi_edge_start.py' -v

      - name: Test v42.0-48 per-session UARTE0 ledger state machine
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Iapp/tests/host_stubs -Iapp/include \
            app/src/p3_session_diag.c app/tests/test_p3_session_diag.c \
            -o /tmp/test_p3_session_diag
          /tmp/test_p3_session_diag

      - name: Test v42.0-48 per-session source-only observability contract
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover \
            -s app/tests -p 'test_v42_0_48_session_observability.py' -v

      - name: Test v42.0-49 goal+silence timing policy on host
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -pedantic -Iapp/include \
            app/tests/test_p3_goal_exit.c -o /tmp/test_p3_goal_exit
          /tmp/test_p3_goal_exit

      - name: Test v42.0-49 exit cause and firmware policy static contract
        run: |
          PYTHONPATH=app/tools python3 -m unittest discover \
            -s app/tests -p 'test_v42_0_49_goal_exit.py' -v

      - name: Test v42.0-49 Zigbee2MQTT 41.3/48/49 firmware gate
        run: |
          node app/tests/test_v42_0_49_z2m_compat.mjs

      - name: Initialize Nordic Zigbee R23 v1.4.0 workspace
        run: |
          mkdir workspace
          cd workspace
          west init -m https://github.com/nrfconnect/ncs-zigbee --mr v1.4.0 .
          west update
          west list -f '{name}: {revision} {abspath}' > ../west-projects.txt

      - name: Install Zephyr and NCS Python requirements
        run: |
          pip install -r workspace/zephyr/scripts/requirements.txt
          pip install -r workspace/nrf/scripts/requirements.txt

      - name: Install Zephyr SDK
        run: |
          SDK_VERSION=1.0.1
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}/zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          tar -xf "zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          mv "zephyr-sdk-${SDK_VERSION}" "$HOME/zephyr-sdk"
          "$HOME/zephyr-sdk/setup.sh" -t arm-zephyr-eabi -h -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk" >> "$GITHUB_ENV"

      - name: Build custom nice nano board (diagnostic)
        id: build
        continue-on-error: true
        working-directory: workspace
        run: |
          set -o pipefail
          west build -b nicenano_zigbee/nrf52840 \
            -d "$GITHUB_WORKSPACE/build-nicenano" \
            --pristine=always --no-sysbuild \
            "$GITHUB_WORKSPACE/app" -- \
            "-DBOARD_ROOT=$GITHUB_WORKSPACE/app" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify v42.0-43 hybrid idle / UARTE motor RX safety
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          grep -q 'src/tuya_uart_hybrid.c' app/CMakeLists.txt
          if grep -q 'src/tuya_uart_isolated.c' app/CMakeLists.txt; then
            echo '::error::no-op TX stub still compiled'
            exit 1
          fi
          if grep -qF '  src/tuya_uart.c' app/CMakeLists.txt; then
            echo '::error::Legacy UART0 RX/TX worker must not be compiled'
            exit 1
          fi
          grep -q 'zephyr,deferred-init;' app/app.overlay
          python3 - <<'PY'
          from pathlib import Path
          dts = Path('build-nicenano/zephyr/zephyr.dts').read_text()
          node_start = dts.find('uart0: uart@40002000 {')
          if node_start < 0:
              raise SystemExit('::error::UART0 node missing in generated DTS')
          node_end = dts.find('};', node_start)
          node = dts[node_start:node_end]
          if 'zephyr,deferred-init;' not in node or 'status = "okay";' not in node:
              raise SystemExit('::error::UART0 is not enabled with deferred-init')
          print('UART0 DeviceTree deferred-init: confirmed')
          PY
          cfg=build-nicenano/zephyr/.config
          grep -qx '^CONFIG_PM_DEVICE=y' "$cfg" || { echo '::error::CONFIG_PM_DEVICE is not enabled'; exit 1; }
          grep -q 'p3_soft_uart_start()' app/src/main.c
          grep -q 'tuya_uart_set_rx_ready(true);' app/src/main.c
          grep -q '#define P3_ZIGBEE_POLL_INTERVAL_MS 1000U' app/src/main.c
          grep -q 'zb_zdo_pim_set_long_poll_interval(P3_ZIGBEE_POLL_INTERVAL_MS);' app/src/main.c
          if grep -q 'k_sleep(K_SECONDS(30))' app/src/main.c; then
            echo '::error::Obsolete 30-second UART boot blackout remains'
            exit 1
          fi
          grep -q 'tuya_uart_accept_report(&decoded);' app/src/main.c
          grep -q 'tuya_uart_submit_action(action)' app/src/main.c
          grep -q 'tuya_uart_submit_position(percent)' app/src/main.c
          grep -q 'NRF_UARTE1->TASKS_STARTTX = 1U' app/src/tuya_uart_hybrid.c
          grep -q 'NRF_UARTE1->TASKS_STOPTX = 1U' app/src/tuya_uart_hybrid.c
          grep -q 'NRF_UARTE1->ENABLE = 0U' app/src/tuya_uart_hybrid.c
          grep -q 'P3_TX_PIN                20U' app/src/tuya_uart_hybrid.c
          grep -q 'DT_NODE_HAS_STATUS(DT_NODELABEL(uart1), okay)' app/src/tuya_uart_hybrid.c
          grep -q 'uart1 { status = "disabled";' app/boards/others/nicenano_zigbee/nicenano_zigbee_nrf52840.dts
          grep -q 'tx_frames: 0xF113' app/zigbee2mqtt/external_converters/p3_nrf52840.mjs
          grep -q 'P3_UART_INIT_RC 0xF11FU' app/src/main.c
          grep -q 'P3_UART_DEINIT_RC 0xF120U' app/src/main.c
          grep -q 'P3_UART_RESUME_RC 0xF122U' app/src/main.c
          grep -q 'P3_UART_SUSPEND2_RC 0xF123U' app/src/main.c
          grep -q 'P3_UART_RX_RC 0xF124U' app/src/main.c
          grep -q 'P3_UART_RX_BYTE 0xF125U' app/src/main.c
          grep -q 'P3_UART_RX_ATTEMPTS 0xF126U' app/src/main.c
          grep -q 'P3_UART_RX_WAIT_MS 0xF127U' app/src/main.c
          grep -q 'P3_STRESS_CYCLES 0xF128U' app/src/main.c
          grep -q 'P3_STRESS_ELAPSED_S 0xF132U' app/src/main.c
          # v42.0-40: never stop passive RX at 1200 s, but UARTE still sleeps between bursts.
          grep -q 'while (true)' app/src/main.c
          if grep -q '1200000U' app/src/main.c; then
            echo '::error::Obsolete 1200-second receiver timeout remains'
            exit 1
          fi
          grep -q 'P3_UART_IDLE_MS 15U' app/src/p3_soft_uart.c
          grep -q 'p3_uart_disable();' app/src/p3_soft_uart.c
          grep -q 'tuya_parser_feed(&parser' app/src/main.c
          grep -q 'p3_soft_uart_read(&received' app/src/main.c
          grep -q 'src/p3_soft_uart.c' app/CMakeLists.txt
          grep -q 'nrf_timer_event_check' app/src/p3_soft_uart.c
          grep -q 'p3_uart_begin_dma' app/src/p3_soft_uart.c
          grep -q 'TASKS_STARTRX = 1U' app/src/p3_soft_uart.c
          grep -q 'TASKS_STOPRX = 1U' app/src/p3_soft_uart.c
          grep -q 'EVENTS_RXTO' app/src/p3_soft_uart.c
          grep -q 'NRF_UARTE0->RXD.PTR' app/src/p3_soft_uart.c
          grep -q 'uart_wake_count: 0xF135' app/zigbee2mqtt/external_converters/p3_nrf52840.mjs
          grep -q 'uart_dma_bytes: 0xF136' app/zigbee2mqtt/external_converters/p3_nrf52840.mjs
          grep -q 'P3_RX_NEXT_START' app/src/p3_soft_uart.c
          grep -q 'rx_phase = P3_RX_DATA' app/src/p3_soft_uart.c
          grep -q 'nrf_uarte_disable(NRF_UARTE0)' app/src/p3_soft_uart.c
          grep -q 'P3_RX_HEADER_COUNT 0xF137U' app/src/main.c
          grep -q 'P3_RX_ERROR_COUNT 0xF138U' app/src/main.c
          grep -q 'P3_RX_FIRST4 0xF139U' app/src/main.c
          grep -q 'P3_RX_NEXT4 0xF13AU' app/src/main.c
          grep -q 'P3_RX_LAST_ERROR 0xF13BU' app/src/main.c
          grep -q 'P3_RX_FRAMING_ERRORS 0xF13CU' app/src/main.c
          grep -q 'P3_RX_RING_OVERFLOWS 0xF13DU' app/src/main.c
          grep -q 'P3_RX_SOFTWARE_STARTS 0xF13EU' app/src/main.c
          grep -q 'P3_RX_SOFTWARE_NONHEADER 0xF13FU' app/src/main.c
          grep -q 'P3_UART_LAST_ERRORSRC 0xF140U' app/src/main.c
          grep -q 'P3_RX_GPIO_START_EVENTS 0xF141U' app/src/main.c
          grep -q 'P3_RX_BAD_STOP_GPIO 0xF143U' app/src/main.c
          grep -q 'P3_RX_BAD_STOP_CHAINED 0xF144U' app/src/main.c
          grep -q 'P3_RX_BAD_STOP_REPORTED_IDLE 0xF145U' app/src/main.c
          grep -q 'P3_RX_BAD_STOP_REPORTED_MOVING 0xF146U' app/src/main.c
          grep -q 'P3_RX_REPORTED_MOTION 0xF14AU' app/src/main.c
          grep -q 'P3_RX_GPIO_STARTS_REPORTED_IDLE 0xF14BU' app/src/main.c
          grep -q 'P3_RX_GPIO_STARTS_REPORTED_MOVING 0xF14CU' app/src/main.c
          grep -q 'P3_RX_GPIO_STARTS_MOTION_UNKNOWN 0xF14DU' app/src/main.c
          grep -q 'rx_gpio_starts_reported_idle: 0xF14B' app/zigbee2mqtt/external_converters/p3_nrf52840.mjs
          grep -q 'rx_gpio_starts_reported_moving: 0xF14C' app/zigbee2mqtt/external_converters/p3_nrf52840.mjs
          grep -q 'rx_gpio_starts_motion_unknown: 0xF14D' app/zigbee2mqtt/external_converters/p3_nrf52840.mjs
          grep -q 'rx_gpio_start_events: 0xF141' app/zigbee2mqtt/external_converters/p3_nrf52840.mjs
          grep -q 'rx_reported_motion: 0xF14A' app/zigbee2mqtt/external_converters/p3_nrf52840.mjs
          grep -q 'p3_soft_uart_set_mcu_motion(reported_motion)' app/src/tuya_uart_hybrid.c
          grep -q 'rx_framing_errors: 0xF13C' app/zigbee2mqtt/external_converters/p3_nrf52840.mjs
          grep -q 'rx_ring_overflows: 0xF13D' app/zigbee2mqtt/external_converters/p3_nrf52840.mjs
          grep -q 'p3_soft_uart_software_nonheader_bytes()' app/src/main.c
          grep -q 'p3_soft_uart_last_hw_errorsrc()' app/src/main.c
          grep -q 'blind_ctx.diag_last_command = decoded.command' app/src/main.c
          if grep -q 'uart_poll_out(' app/src/tuya_uart_hybrid.c; then echo '::error::No blocking Zephyr UART0 TX allowed'; exit 1; fi
          grep -qx '^CONFIG_P3_UART_TX_ENABLE=y' "$cfg" || { echo '::error::Zigbee motor TX expected on dedicated UARTE1'; exit 1; }
          grep -q 'NRF_UARTE0->RXD.PTR' app/src/p3_soft_uart.c
          grep -q 'P3_UART_TEST_PHASE 0xF121U' app/src/main.c
          echo "=== v42.0-43 power configuration diagnostics ==="
          grep -E '^(CONFIG_(ZIGBEE_ROLE_END_DEVICE|PM|TICKLESS_KERNEL|LOG)=|# CONFIG_(ZIGBEE_ROLE_END_DEVICE|PM|TICKLESS_KERNEL|LOG) is not set)' "$cfg" || true
          for opt in ZIGBEE_ROLE_END_DEVICE TICKLESS_KERNEL; do
            if ! grep -qx "CONFIG_${opt}=y" "$cfg"; then
              echo "::error::CONFIG_${opt}=y is missing from generated Zephyr .config"
              exit 1
            fi
          done
          if grep -qx 'CONFIG_LOG=y' "$cfg"; then
            echo "::error::CONFIG_LOG is still enabled in generated Zephyr .config"
            exit 1
          fi
          grep -q 'calibration-button' app/app.overlay
          grep -q 'P3 LOCAL ordinary DP1 STOP queued' app/src/main.c
          grep -q 'P3_BUTTON_PRESS_COUNT 0xF119U' app/src/main.c
          grep -q 'P3_BUTTON_LAST_EVENT 0xF11AU' app/src/main.c
          grep -q 'P3_LOCAL_FINISH_TX_DELAY_MS 0xF11EU' app/src/main.c
          grep -q 'tuya_motor_encode_action(action' app/src/tuya_uart_hybrid.c
          grep -q 'action == TUYA_MOTOR_STOP' app/src/tuya_uart_hybrid.c
          grep '^CONFIG_USE_DT_CODE_PARTITION=y' "$cfg"
          for opt in P3_MCU_INIT_ENABLE P3_DIAG_STARTUP_QUERIES P3_ZCL_POSITION_INVERT; do
            if grep -qx "CONFIG_${opt}=y" "$cfg"; then
              echo "::error::Unsafe default: CONFIG_${opt} enabled"
              exit 1
            fi
            # Kconfig hides options whose dependencies are disabled:
            # absent and '# ... is not set' are both SAFE (effectively n).
            # Only an explicitly enabled flag is unsafe for first flash.
            if grep -q "^CONFIG_${opt}=" "$cfg"; then
              grep -qx "CONFIG_${opt}=n" "$cfg" || {
                echo "::error::Unexpected value for CONFIG_${opt}"
                exit 1
              }
            fi
          done
          grep -qx '^CONFIG_P3_ZCL_POSITION_ENABLE=y' "$cfg"
          grep -qx '^CONFIG_P3_UART_TX_ENABLE=y' "$cfg"
          grep -qx '^CONFIG_P3_ZCL_BATTERY_ENABLE=y' "$cfg"
          grep -qx '^CONFIG_P3_POSITION_TARGET_ENABLE=y' "$cfg"
          grep -q 'tuya_uart_submit_position(percent)' app/src/main.c
          grep -qx '^CONFIG_SETTINGS=y' "$cfg"
          grep -qx '^CONFIG_SETTINGS_NVS=y' "$cfg"
          if grep -qx '^CONFIG_P3_HW_CALIBRATION_ENABLE=y' "$cfg"; then echo '::error::Calibration must be off'; exit 1; fi
          grep -q 'tuya_uart_submit_hw_calibration' app/src/main.c
          grep -q 'status = "okay";' app/boards/others/nicenano_zigbee/nicenano_zigbee_nrf52840.dts
          echo "v42.0-43 CONFIG PASS: idle hybrid RX + bounded full UARTE0 during motion; independent UARTE1 TX."

      - name: Convert HEX to UF2 and validate flash ranges
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          test -s build-nicenano/zephyr/zephyr.hex
          python3 workspace/zephyr/scripts/build/uf2conv.py \
            -c -f 0xada52840 \
            -o build-nicenano/zephyr/zephyr.uf2 \
            build-nicenano/zephyr/zephyr.hex
          python3 app/tools/check_uf2_layout.py \
            build-nicenano/zephyr/zephyr.uf2 | tee diagnostic/uf2_report.txt

      - name: Print first compilation errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "=== First compiler / linker errors from build.log ==="
          grep -n -E 'fatal error:|error:|undefined reference|CMake Error|FAILED:|build stopped' build.log | head -n 60 || true
          echo "=== Tail of build.log ==="
          tail -n 60 build.log || true

      - name: Save diagnostic configuration
        if: always()
        run: |
          mkdir -p diagnostic
          cp -f build.log diagnostic/ 2>/dev/null || true
          cp -f west-projects.txt diagnostic/ 2>/dev/null || true
          cp -f build-nicenano/zephyr/.config diagnostic/zephyr.config 2>/dev/null || true
          cp -f build-nicenano/zephyr/zephyr.dts diagnostic/zephyr.dts 2>/dev/null || true
          cp -f build-nicenano/zephyr/zephyr.map diagnostic/zephyr.map 2>/dev/null || true
          if [ -f build-nicenano/zephyr/.config ]; then
            grep -E '^(CONFIG_(SOC_NRF52840|HAS_NRFX|ZIGBEE_ADD_ON|ZIGBEE_ROLE_).*)' build-nicenano/zephyr/.config || true
          fi

      - name: Upload diagnostic files (not flash-ready)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zigbee-build-diagnostics
          path: diagnostic/
          if-no-files-found: warn

      - name: Package P3-NRF52840 v42.0-48 UNVERIFIED experimental UF2
        if: success() && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p release
          cp build-nicenano/zephyr/zephyr.uf2 release/P3-NRF52840-v42-0-49-GOAL-SILENCE-EXIT-BENCH-UNVERIFIED.uf2
          cp diagnostic/uf2_report.txt release/UF2_VALIDATION.txt
          cp build-nicenano/zephyr/.config release/zephyr.config
          git -C app rev-parse HEAD > release/SOURCE_COMMIT.txt
          (
            cd release
            sha256sum P3-NRF52840-v42-0-49-GOAL-SILENCE-EXIT-BENCH-UNVERIFIED.uf2 > SHA256SUMS.txt
            test -s P3-NRF52840-v42-0-49-GOAL-SILENCE-EXIT-BENCH-UNVERIFIED.uf2
          )
          python3 app/tools/check_uf2_layout.py release/P3-NRF52840-v42-0-49-GOAL-SILENCE-EXIT-BENCH-UNVERIFIED.uf2
          cat > release/READ_ME_FIRST.txt <<'EOF'
          P3-NRF52840 v42.0-49 — GOAL+3S SILENCE RX EXIT BENCH
          After a completed accepted DP3 target report, an empty RX ring
          and 3000ms without new UARTE0 RX bytes, return to low-power
          GPIO/PPI/TIMER3. Existing 1500ms DP1 STOP guard is unchanged.
          Hard 120s watchdog remains as final bound; never send motor STOP.
          Exit reason 5; cumulative count Basic 0xF199.
          Compact Z2M diagnostics gated per device by SWBuildID >=42.0-48.
          Two v41.3 kitchen motors stay on cover+battery, no unsupported
          v42-only reads. Requires compatible converter and new interview
          if Zigbee2MQTT does not yet know SWBuildID.
          v42.0-48 — GPIOTE/PPI TIMER3 EDGE-START BENCH
          Experimental GPIOTE IN -> dynamically allocated PPI channel
          -> TIMER3 TASKS_START. Zephyr GPIO driver retains GPIOTE ownership.
          No IN channel or free PPI: original GPIO interrupt timing fallback.
          Diagnostic attributes: Basic 0xF187..0xF18A.
          PPI path does NOT restart TIMER3 inside the GPIO callback.
          HFCLK startup may still cause sampling errors: verify on HW-954.
          Motor control/calibration/120s watchdog unchanged from v42.0-48.
          EXPERIMENTAL: NOT VALIDATED on physical blind.
          Parent v42.0-47 — INVALID SOFTWARE STOP RECOVERY
          On an invalid STOP bit in low-power GPIO/TIMER3 mode,
          terminate the speculative software-byte chain, stop TIMER3,
          disable UARTE0 warmup if needed, reset bit decoder and
          resume GPIO falling-edge capture. Valid nonheader chaining
          and 0x55 -> UARTE0 DMA handoff remain unchanged.
          No new hardware RX hold, retry, wake polling or motor commands.
          Tested by static source contract and CI build only;
          physical current and edge timing still need bench checks.
          v42.0-46 command outcome counters and protocols are retained.
          0xF179..0xF186: accepted TX, MCU report after TX, target reported,
          STOP reported, timeout without MCU report / without target,
          superseded by newer TX, and last status. This is telemetry,
          NOT direct confirmation of motor travel or a Tuya protocol ACK.
          Passive one-shot result timeout: 180 s, target tolerance 1%.
          No automatic UART TX, retry, polling, calibration, or changes
          to the motor command format/timing or the 120s RX watchdog.
          v42.0-45 hardware RX and SAADC behavior is retained.
          Previous v42.0-45 notes follow.
          NEW: explicit VDDH/VDD TACQ=10us; each 10-minute sample uses
          driver offset calibration + 16x oversampling (not a gain correction).
          This DOES NOT calibrate VDDH to BAT+: check 4.031V meter vs SAADC.
          NEW: after watchdog lockout, only a validated changed MCU DP3
          following >=10 s without changed DP3 can wake full UARTE0.
          One such physical-position wake allowed per fresh MCU STOP/explicit
          motor command. Repeated DP1 or DP3 cannot extend 120s session.
          Check Z2M 0xF175..0xF178. No unrequested motor commands added.
          THESE ARE SUPPLY RAILS, NOT VERIFIED BATTERY VOLTAGE.
          DO NOT LABEL VDDH VOLTAGE AS BAT+ WITHOUT BOARD VERIFICATION.
          EXPERIMENTAL / BENCH ONLY. Hardware validation still required.
          ZCL 0xF16A..F16F: VDDH (mV from internal /5), VDD (mV),
          valid mask, count, timestamp, last error; sampled at low duty cycle.
          ZCL 0xF170..F174: software UART bad STOP bursts, faults within
          30s after exiting direct RX versus others, age from last GPIO edge,
          last direct RX exit time. Original UART decoding remains unchanged.
          Existing 120 s non-renewable watchdog / STOP semantics preserved.

          FIX from v42.0-42:
          Direct UARTE0 receiver has a HARD 120-second upper bound measured
          from the actual UARTE0 RXSTARTED activation. Repeated P3 MCU
          DP1=OPEN/CLOSE events cannot reset this deadline. Repeated identical
          DP1 reports cannot re-arm receiver after power-watchdog timeout.
          A fresh DP1=STOP clears auto-rearm lockout and starts a 1500-ms
          release guard; repeated STOP cannot extend it. Explicit Zigbee
          motor commands may initiate a new bounded RX session.
          The watchdog does NOT transmit STOP to the motor.

          Low-power idle uses GPIO/TIMER3 -> UARTE0 for first 0x55, then
          EasyDMA for remainder. During commanded movement, all bytes are
          received through full UARTE0 + EasyDMA. Motor TX remains independent
          UARTE1. New read-only ZCL diagnostics 0xF168 (actual session start
          uptime ms) and 0xF169 (post-watchdog automatic motion lockout).

          STOP is transmitted with at most 20ms prearm wait; other commands
          wait <=80ms. No new startup motor traffic, calibrations, retries.
          Existing Zigbee poll remains 1000ms. No GPIO/pin changes needed.

          SAFETY: compile and firmware checks are not a physical test.
          Bench with motor clear of obstruction and local STOP accessible.
          Measure idle UARTE current; monitor hw_direct_enters/exits,
          hw_direct_session_start_ms, hw_direct_motion_lockout,
          hw_direct_max_timeouts, Tuya frames ok/rejected, and ERROR SRC.
          Demonstrate watchdog exits after missing STOP in controlled test.
          Do not use this build unattended with a curtain attached.
          EOF

      - name: Upload P3-NRF52840 v42.0-48 UNVERIFIED experimental UF2
        if: success() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: P3-NRF52840-v42-0-49-GOAL-SILENCE-EXIT-BENCH-UNVERIFIED-UF2
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Report build status
        if: steps.build.outcome == 'failure'
        run: |
          echo "Diagnostic build failed; inspect zigbee-build-diagnostics artifact."
          exit 1
