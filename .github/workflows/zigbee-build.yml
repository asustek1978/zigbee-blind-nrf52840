name: Zigbee nRF52840 Linux build

on:
  workflow_dispatch:
  push:
    branches: [main, feature/window-covering-end-device, feature/battery-voltage-v42-research, experiment/v42-0-2-sleep-test, experiment/v42-0-3-led-test, experiment/v42-0-4-led-scanner]
    paths:
      - '.github/workflows/zigbee-build.yml'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'include/**'
      - 'boards/**'
      - 'app.overlay'
      - 'Kconfig'
      - 'zigbee2mqtt/**'
      - 'prj.conf'
      - 'CMakeLists.txt'
      - 'Kconfig.sysbuild'
      - 'sysbuild.conf'

permissions:
  contents: read

jobs:
  diagnostic-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout blind application
        uses: actions/checkout@v4
        with:
          path: app

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build gperf ccache dfu-util device-tree-compiler \
            wget xz-utils file gcc g++ make python3-dev python3-pip python3-venv \
            libmagic1

      - name: Create Python environment
        run: |
          python3 -m venv "$GITHUB_WORKSPACE/.venv"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/.venv/bin/pip" install -U pip west

      - name: Initialize Nordic Zigbee R23 v1.4.0 workspace
        run: |
          mkdir workspace
          cd workspace
          west init -m https://github.com/nrfconnect/ncs-zigbee --mr v1.4.0 .
          west update
          west list -f '{name}: {revision} {abspath}' > ../west-projects.txt

      - name: Install Zephyr and NCS Python requirements
        run: |
          pip install -r workspace/zephyr/scripts/requirements.txt
          pip install -r workspace/nrf/scripts/requirements.txt

      - name: Install Zephyr SDK
        run: |
          SDK_VERSION=1.0.1
          wget -q "https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v${SDK_VERSION}/zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          tar -xf "zephyr-sdk-${SDK_VERSION}_linux-x86_64_minimal.tar.xz"
          mv "zephyr-sdk-${SDK_VERSION}" "$HOME/zephyr-sdk"
          "$HOME/zephyr-sdk/setup.sh" -t arm-zephyr-eabi -h -c
          echo "ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk" >> "$GITHUB_ENV"

      - name: Build isolated LED GPIO scanner
        working-directory: workspace
        run: |
          set -euo pipefail
          west build -b nicenano_zigbee/nrf52840 \
            -d "$GITHUB_WORKSPACE/build-sleep" \
            --pristine=always --no-sysbuild \
            "$GITHUB_WORKSPACE/app/tests/sleep_probe" -- \
            "-DBOARD_ROOT=$GITHUB_WORKSPACE/app"

      - name: Convert and validate UF2
        run: |
          set -euo pipefail
          mkdir -p release
          python3 workspace/zephyr/scripts/build/uf2conv.py \
            -c -f 0xada52840 \
            -o release/P3-NRF52840-v42-0-4-LED-SCANNER.uf2 \
            build-sleep/zephyr/zephyr.hex
          python3 app/tools/check_uf2_layout.py release/P3-NRF52840-v42-0-4-LED-SCANNER.uf2 | tee release/UF2_VALIDATION.txt
          git -C app rev-parse HEAD > release/SOURCE_COMMIT.txt
          (cd release && sha256sum *.uf2 > SHA256SUMS.txt)
          printf 'EXPERIMENT ONLY: no Zigbee, no motor control. 5s lead-in, each candidate HIGH 3s LOW 3s INPUT 2s, 10s gap. Battery-only spare board.\n' > release/READ_ME_FIRST.txt

      - name: Upload LED GPIO scanner
        uses: actions/upload-artifact@v4
        with:
          name: P3-NRF52840-v42-0-4-LED-Scanner-UF2
          path: release/
          if-no-files-found: error
