#
# Zigbee window covering - battery End Device (not router).
# UART0 is reserved for future Tuya P3 bridge at 9600 baud.
#
CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GPIO=y

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y

# Pair exclusively with the user's Zigbee2MQTT coordinator (channel 11).
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_SINGLE=y
CONFIG_ZIGBEE_CHANNEL=11

# No Nordic DK buttons/LEDs on nice!nano.
CONFIG_DK_LIBRARY=n

# Disabled until actual P3 field qualification; no motor TX by default.
CONFIG_P3_UART_TX_ENABLE=n
CONFIG_P3_MCU_INIT_ENABLE=n
CONFIG_P3_ZCL_POSITION_ENABLE=n
CONFIG_P3_ZCL_POSITION_INVERT=n
CONFIG_P3_ZCL_BATTERY_ENABLE=n
