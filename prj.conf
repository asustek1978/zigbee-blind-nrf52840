#
# Zigbee window covering - battery End Device (not router).
# UART0 is reserved for future Tuya P3 bridge at 9600 baud.
#
CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GPIO=y
# v42.0-33: Zephyr NCS 3.4.0 / Zephyr 4.4 uses GPPI allocator (not legacy NRFX_PPI).
CONFIG_NRFX_GPPI=y

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# v42.0-7: tickless System ON idle while preserving UART and Zigbee.
# CONFIG_PM is unavailable in the generated configuration of this SDK/board.
# Do not require Zephyr device/system PM for the first controlled measurement.
CONFIG_TICKLESS_KERNEL=y
CONFIG_LOG=n
# CONFIG_PRINTK is selected by NCS/Zephyr in this build; forcing n
# produces a Kconfig warning and aborts the build. No printk calls are used.
CONFIG_BOOT_BANNER=n

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_END_DEVICE=y

# Pair exclusively with the user's Zigbee2MQTT coordinator (channel 11).
CONFIG_ZIGBEE_CHANNEL_SELECTION_MODE_SINGLE=y
CONFIG_ZIGBEE_CHANNEL=11

# No Nordic DK buttons/LEDs on nice!nano.
CONFIG_DK_LIBRARY=n

# Build 34: UART control with provisional DP13 battery percentage reporting.
# Build 35: experimental DP2 position targets enabled on the test blind only.
CONFIG_P3_UART_TX_ENABLE=n
# No automatic service/startup UART traffic.
CONFIG_P3_DIAG_STARTUP_QUERIES=n
CONFIG_P3_MCU_INIT_ENABLE=n
CONFIG_P3_ZCL_POSITION_ENABLE=y
CONFIG_P3_ZCL_POSITION_INVERT=n
CONFIG_P3_ZCL_BATTERY_ENABLE=y

# Supervised experimental test: DP2 target behavior is unverified.
CONFIG_P3_POSITION_TARGET_ENABLE=n

# Build 36 persistent software endpoints in reserved storage partition
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# Build 37: opt-in hardware calibration captured from original WBR3
CONFIG_P3_HW_CALIBRATION_ENABLE=n

# v42.0-17: allow explicit device_deinit() for the one-shot UART test.
CONFIG_DEVICE_DEINIT_SUPPORT=y

# v42.0-19: device PM action API for UART0 suspend/resume experiment.
CONFIG_PM_DEVICE=y
